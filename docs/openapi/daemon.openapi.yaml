openapi: 3.1.0
info:
  title: MaDao Daemon API
  version: 0.1.21
  description: |
    当前 `MaDao` daemon 对外 HTTP API 的机器可读规范。

    维护规则：
    - 该文件必须与 `crates/sms-server/src/lib.rs` 中的实际路由保持同步。
    - 新增、删除、修改 HTTP 路由或请求/响应结构时，必须同步更新本文件。
    - 规范以当前代码真实行为为准，不按“理想设计”推断。
servers:
  - url: http://127.0.0.1:7822
    description: Local daemon HTTP endpoint
tags:
  - name: auth
  - name: runtime
  - name: provider-manifests
  - name: providers
  - name: tickets
  - name: routing
  - name: settings
  - name: notifications
paths:
  /health:
    get:
      tags: [runtime]
      summary: Health check
      operationId: health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
                required: [status]
  /auth/status:
    get:
      tags: [auth]
      summary: Get current authentication state
      operationId: authStatus
      responses:
        '200':
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpAuthStatus'
  /auth/check:
    get:
      tags: [auth]
      summary: Check whether current request is authenticated
      operationId: authCheck
      responses:
        '204':
          description: Authenticated
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/login:
    post:
      tags: [auth]
      summary: Login with HTTP secret
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpAuthLoginRequest'
      responses:
        '200':
          description: Authenticated and session cookie issued
          headers:
            Set-Cookie:
              description: Session cookie `madao_http_session`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpAuthStatus'
        '401':
          description: Invalid secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/logout:
    post:
      tags: [auth]
      summary: Logout current session
      operationId: authLogout
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              description: Cleared session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpAuthStatus'
  /api/access-info:
    get:
      tags: [runtime]
      summary: Get HTTP access requirements
      operationId: getAccessInfo
      responses:
        '200':
          description: Runtime access configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeAccessInfo'
  /api/providers:
    get:
      tags: [runtime]
      summary: Get runtime snapshot
      operationId: listRuntime
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Runtime snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/provider-manifests:
    get:
      tags: [provider-manifests]
      summary: List provider manifests
      operationId: listProviderManifests
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Provider manifest list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderManifestList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/provider-manifests/reload:
    post:
      tags: [provider-manifests]
      summary: Reload provider manifests from disk
      operationId: reloadProviderManifests
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Reload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderManifestList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/providers/reorder:
    post:
      tags: [providers]
      summary: Reorder provider priorities
      operationId: reorderProviders
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderReorderRequest'
      responses:
        '200':
          description: Reorder result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderManifestList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/notifications:
    get:
      tags: [notifications]
      summary: List notification feed
      operationId: getNotifications
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Notification feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationFeed'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [notifications]
      summary: Clear notifications
      operationId: clearNotifications
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Cleared notification feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationFeed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tickets:
    get:
      tags: [tickets]
      summary: List tickets
      operationId: listTickets
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Ticket list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tickets/{ticket_id}:
    get:
      tags: [tickets]
      summary: Get ticket detail
      operationId: getTicket
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tickets/{ticket_id}/callbacks:
    get:
      tags: [tickets]
      summary: List callback subscriptions for a ticket
      operationId: listTicketCallbacks
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Callback subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCallbackListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [tickets]
      summary: Register callback subscription for a ticket
      operationId: registerTicketCallback
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCallbackRegistrationRequest'
      responses:
        '200':
          description: Registered subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCallbackSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/settings/runtime:
    get:
      tags: [settings]
      summary: Get runtime settings
      operationId: getRuntimeSettings
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Runtime settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [settings]
      summary: Update runtime settings
      operationId: updateRuntimeSettings
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeSettingsUpdate'
      responses:
        '200':
          description: Updated runtime settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/settings/runtime/regenerate-secret:
    post:
      tags: [settings]
      summary: Regenerate persisted HTTP secret
      operationId: regenerateHttpSecret
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Updated runtime settings with new secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/settings/stats/sync:
    post:
      tags: [settings]
      summary: Immediately upload pending ticket stats events to remote worker
      description: >
        Stats sync also runs automatically in the daemon / desktop background loop when enabled.
        This endpoint triggers an immediate catch-up upload for pending local events.
      operationId: syncTicketStats
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Stats sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSyncResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/settings/stats/summary:
    post:
      tags: [settings]
      summary: Fetch remote stats snapshot summary from configured worker
      description: >
        Reads the public snapshot-only Worker summary endpoint. Provider, service,
        country, and operator filters are applied locally by the daemon; custom
        lookback values outside 24, 72, and 168 hours are rejected instead of
        falling back to Worker realtime aggregation.
      operationId: getRemoteStatsSummary
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteStatsSummaryQuery'
      responses:
        '200':
          description: Remote stats summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteStatsSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/settings/openai-sms-regions:
    get:
      tags: [settings]
      summary: Get cached OpenAI verification channel regions
      description: >
        Returns the locally cached OpenAI verification channel region sets. The UI uses
        `sms_regions` as a keep-list and excludes only `whatsapp-only` countries, which is
        equivalent to `all_supported_countries - (whatsapp_regions - sms_regions)`.
      operationId: getOpenAiSmsRegions
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Cached OpenAI SMS region metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAiSmsRegionsCache'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/settings/option-cache:
    get:
      tags: [settings]
      summary: Get option cache overview
      operationId: getOptionCacheOverview
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Option cache overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionCacheOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/acquire:
    post:
      tags: [tickets]
      summary: Acquire a new SMS activation
      operationId: acquireCode
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireCodeRequest'
      responses:
        '200':
          description: Activation acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquireCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/poll:
    post:
      tags: [tickets]
      summary: Poll SMS code for a ticket
      operationId: pollCode
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollCodeRequest'
      responses:
        '200':
          description: Poll result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/release:
    post:
      tags: [tickets]
      summary: Release or finish a ticket
      operationId: releaseCode
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseCodeRequest'
      responses:
        '200':
          description: Release result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/routing/failover:
    post:
      tags: [routing]
      summary: Trigger routing failover for a ticket
      operationId: failoverRouting
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingFailoverRequest'
      responses:
        '200':
          description: Failover result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquireCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/routing/replace:
    post:
      tags: [routing]
      summary: Replace current routed ticket with the next routing candidate
      operationId: replaceRouting
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingReplaceRequest'
      responses:
        '200':
          description: Replace result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingReplaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/providers/{provider}/balance:
    get:
      tags: [providers]
      summary: Get provider balance
      operationId: getProviderBalance
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Provider balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderBalance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/providers/{provider}/prices:
    post:
      tags: [providers]
      summary: Get provider prices
      operationId: getProviderPrices
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderPriceQuery'
      responses:
        '200':
          description: Provider price list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPriceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/providers/{provider}/refresh-options:
    post:
      tags: [providers]
      summary: Refresh provider dynamic options
      operationId: refreshProviderOptions
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Refreshed dynamic options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDynamicOptions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/providers/{provider}/options-cache:
    get:
      tags: [providers]
      summary: Get cached dynamic options for provider
      operationId: getProviderOptionsCache
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Provider cached options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDynamicOptions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/providers/{provider}/countries:
    get:
      tags: [providers]
      summary: List provider countries
      operationId: getProviderCountries
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Country options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/providers/{provider}/services:
    post:
      tags: [providers]
      summary: List provider services
      operationId: getProviderServices
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderServicesQuery'
      responses:
        '200':
          description: Service options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/providers/{provider}/operators:
    post:
      tags: [providers]
      summary: List provider operators
      operationId: getProviderOperators
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderOperatorsQuery'
      responses:
        '200':
          description: Operator options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/providers/{provider}/manifest:
    get:
      tags: [provider-manifests]
      summary: Get provider manifest
      operationId: getProviderManifest
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Provider manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderManifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/providers/{provider}/reuse-pool:
    post:
      tags: [provider-manifests]
      summary: Clear provider reuse pool
      operationId: clearProviderReusePool
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Reuse pool cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReusePoolClearResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [provider-manifests]
      summary: Save provider manifest
      operationId: putProviderManifest
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderManifest'
      responses:
        '200':
          description: Saved provider manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderManifestSaveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/routing-plans:
    get:
      tags: [routing]
      summary: List routing plans
      operationId: listRoutingPlans
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Routing plan list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingPlanList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [routing]
      summary: Save routing plan
      operationId: saveRoutingPlan
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingPlan'
      responses:
        '200':
          description: Saved routing plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/routing-plans/{plan_id}:
    get:
      tags: [routing]
      summary: Get routing plan detail
      operationId: getRoutingPlan
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Routing plan detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [routing]
      summary: Delete routing plan
      operationId: deleteRoutingPlan
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Deleted routing plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingPlanList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HTTP secret
      description: |
        直接使用 `Authorization: Bearer <http_secret>` 访问受保护接口。
    sessionCookie:
      type: apiKey
      in: cookie
      name: madao_http_session
      description: Session cookie returned by `POST /auth/login`.
  parameters:
    ProviderId:
      name: provider
      in: path
      required: true
      schema:
        type: string
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema:
        type: string
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
