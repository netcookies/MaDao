name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  models: read

jobs:
  release_meta:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      current_tag: ${{ steps.meta.outputs.current_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_asset_prefix: ${{ steps.meta.outputs.release_asset_prefix }}
      release_body: ${{ steps.meta.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate release notes
        id: meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-release-notes.mjs --github-output "$GITHUB_OUTPUT" --notes-file "$RUNNER_TEMP/release-notes.md"

  build:
    name: Build ${{ matrix.target.name }}
    needs: release_meta
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macos-arm64
            runner: macos-15
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            install_linux_deps: false
          - name: macos-amd64
            runner: macos-15-large
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            install_linux_deps: false
          - name: linux-amd64
            runner: ubuntu-22.04
            rust_targets: ""
            args: ""
            install_linux_deps: true
          - name: windows-amd64
            runner: windows-latest
            rust_targets: ""
            args: ""
            install_linux_deps: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_targets }}

      - name: Install Linux system dependencies
        if: matrix.target.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend build
        run: npm run build

      - name: Run Rust checks
        run: cargo check --workspace

      - name: Run core tests
        run: cargo test -p sms-core

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.release_meta.outputs.current_tag }}
          releaseName: ${{ needs.release_meta.outputs.release_name }}
          releaseBody: ${{ needs.release_meta.outputs.release_body }}
          releaseDraft: false
          prerelease: ${{ fromJSON(needs.release_meta.outputs.prerelease) }}
          assetNamePattern: ${{ needs.release_meta.outputs.release_asset_prefix }}-[platform]-[arch][setup].[ext]
          args: ${{ matrix.target.args }}
