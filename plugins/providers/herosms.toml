id = "herosms"
name = "HeroSMS"
kind = "handler_api"
enabled = true
priority = 20
homepage = "https://hero-sms.com/"
description = "兼容 HeroSMS 的 handler_api.php 风格 provider。"

[ui]
protocol_label = "HeroSMS"
badge_label = "H"

[behavior]
cancel_cooldown_sec = 120
operator_selectable = false

[service_aliases]
chatgpt = "dr"
codex = "dr"
gpt = "dr"
openai = "dr"

[defaults]
service = "dr"
country = "US"
auto_pick_country = false
verify_on_register = false
reuse_phone = true
max_price = 0.08
min_price = 0.05
min_balance = 1.0
max_tries = 3
poll_timeout_sec = 120
reuse_max = 2
reuse_ttl_hours = 24

[handler_api]
base_url = "https://hero-sms.com/stubs/handler_api.php"
profile = "standard"
api_key = ""
get_balance_action = "getBalance"
get_prices_action = "getPrices"
get_countries_action = "getCountries"
get_number_action = "getNumberV2"
reactivate_action = "reactivate"
get_status_action = "getStatus"
set_status_action = "setStatus"
status_ready = 1
status_retry = 3
status_finish = 6
status_cancel = 8
balance_prefix = "ACCESS_BALANCE:"
success_status_prefix = "STATUS_OK:"
wait_status_tokens = ["STATUS_WAIT_CODE", "STATUS_WAIT_RETRY", "STATUS_WAIT_RESEND"]
failure_status_tokens = [
    "STATUS_CANCEL",
    "BAD_STATUS",
    "NO_ACTIVATION",
    "BAD_KEY",
    "BAD_SERVICE",
]
id_json_pointers = [
    "/activationId",
    "/activation_id",
    "/id",
]
phone_json_pointers = [
    "/phoneNumber",
    "/phone",
    "/number",
]
price_json_pointers = [
    "/activationCost",
    "/price",
]
balance_json_pointers = [
    "/balance",
    "/amount",
    "/data/balance",
    "/data/amount",
]
code_json_pointers = [
    "/sms/code",
    "/code",
    "/data/code",
    "/sms/0/code",
]
