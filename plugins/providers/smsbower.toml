id = "smsbower"
name = "SmsBower"
kind = "handler_api"
enabled = true
priority = 30
homepage = "https://smsbower.app/"
description = "兼容 SmsBower 的 handler_api.php 风格 provider。"

[service_aliases]
chatgpt = "dr"
codex = "dr"
gpt = "dr"
openai = "dr"

[defaults]
service = "openai"
country = "31"
auto_pick_country = false
verify_on_register = false
reuse_phone = true
max_price = 0.08
min_price = 0.0
min_balance = 1.0
max_tries = 3
poll_timeout_sec = 120
reuse_max = 2

[handler_api]
base_url = "https://smsbower.page/stubs/handler_api.php"
api_key = ""
get_balance_action = "getBalance"
get_prices_action = "getPrices"
get_countries_action = "getCountries"
get_number_action = "getNumberV2"
get_status_action = "getStatus"
set_status_action = "setStatus"
status_ready = 1
status_retry = 3
status_finish = 6
status_cancel = 8
balance_prefix = "ACCESS_BALANCE:"
success_status_prefix = "STATUS_OK:"
wait_status_tokens = ["STATUS_WAIT_CODE"]
failure_status_tokens = [
    "STATUS_CANCEL",
    "BAD_STATUS",
    "NO_ACTIVATION",
    "BAD_KEY",
    "BAD_SERVICE",
]
id_json_pointers = [
    "/activationId",
    "/activation_id",
    "/id",
]
phone_json_pointers = [
    "/phoneNumber",
    "/phone",
    "/number",
]
price_json_pointers = [
    "/activationCost",
    "/price",
]
balance_json_pointers = [
    "/balance",
    "/amount",
    "/data/balance",
    "/data/amount",
]
code_json_pointers = [
    "/sms/code",
    "/code",
    "/data/code",
    "/sms/0/code",
]
